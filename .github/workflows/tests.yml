name: Tests

on:
  # Every pull request, not only those based on main: a stacked PR sits on
  # another feature branch, and filtering by base silently gave it no checks
  # at all rather than a red one.
  pull_request:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Its own job, so a red build says at a glance which kind of problem it is:
  # a formatting slip and a failing test are not the same news.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t avicoin:ci .
      - name: A started container serves a tip
        run: |
          set -euo pipefail
          docker run -d --name avicoin-ci -p 18080:8080 avicoin:ci \
            --data-dir=/avicoin/data --host-address=0.0.0.0:34352 \
            --api-address=0.0.0.0:8080 --network=test --mine
          # Bounded, like every other wait in this project.
          for _ in $(seq 40); do
            if curl -fsS http://127.0.0.1:18080/status; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18080/status | tee /dev/stderr | grep -q '"tip"'
          curl -fsS http://127.0.0.1:18080/ | grep -q '<title>Avi Coin</title>'
      - name: It runs as somebody who is not root
        run: test "$(docker exec avicoin-ci id -un)" = avicoin
      # Twice, with a mined block between: the first call has nothing
      # remembered and reports healthy whatever the node is doing, so on its
      # own it would pass against a node wedged at height zero.
      - name: Its own healthcheck sees the tip move
        run: |
          set -euo pipefail
          before=$(curl -fsS http://127.0.0.1:18080/status | grep -o '"height":[0-9]*')
          docker exec avicoin-ci avicoin health --api-address 127.0.0.1:8080
          for _ in $(seq 40); do
            now=$(curl -fsS http://127.0.0.1:18080/status | grep -o '"height":[0-9]*')
            if [ "$now" != "$before" ]; then break; fi
            sleep 0.5
          done
          test "$now" != "$before"
          docker exec avicoin-ci avicoin health --api-address 127.0.0.1:8080
      - name: And says so when it has not
        run: |
          set -euo pipefail
          # A window of zero against a marker just written: the tip cannot have
          # moved within the same second, so this must refuse.
          docker exec avicoin-ci avicoin health --api-address 127.0.0.1:8080
          if docker exec avicoin-ci avicoin health --api-address 127.0.0.1:8080 \
               --stall-seconds 0 --marker /tmp/stalled; then
            echo "a healthcheck that cannot fail is not a healthcheck" >&2
            exit 1
          fi || true
          docker exec avicoin-ci sh -c 'echo "0 1" > /tmp/stalled'
          if docker exec avicoin-ci avicoin health --api-address 127.0.0.1:8080 \
               --stall-seconds 0 --marker /tmp/stalled; then
            echo "a tip standing at 0 since 1970 is not healthy" >&2
            exit 1
          fi
      - name: Docker agrees the container is healthy
        run: |
          set -euo pipefail
          for _ in $(seq 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' avicoin-ci)
            if [ "$state" = healthy ]; then break; fi
            sleep 1
          done
          test "$state" = healthy
      - name: What it said
        if: always()
        run: docker logs avicoin-ci || true

  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the node
        run: cargo build
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run functional tests
        run: python -m pytest test/functional -v
