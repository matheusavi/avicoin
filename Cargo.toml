[package]
name = "avicoin"
version = "0.1.0"
edition = "2021"

[dependencies]
# No default features: `std` there means `fixed-hash/std`, which enables an
# optional `rand 0.8` we never call and which carries RUSTSEC-2024-0421. We use
# U256/U512 arithmetic, which is in the core of the crate.
primitive-types = { version = "0.14.0", default-features = false }
sha2 = "0.11"
anyhow = "1.0.98"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
clap = { version = "4.6.1", features = ["derive"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
hex = "0.4.3"
ripemd = "0.2.0"
redb = "4.2.0"
tiny_http = "0.12.0"
serde_json = "1.0.151"

[dev-dependencies]
rstest = "0.26.1"
